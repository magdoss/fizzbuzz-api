[global]
error_log = /proc/self/fd/2
log_limit = 8192
; on a graceful stop, let running requests finish instead of cutting their streams
process_control_timeout = 30s

[www]
listen = 9000
pm = static
pm.max_children = 8
; Symfony reads its configuration from the container environment
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
; nginx already writes the access log
access.log = /dev/null
