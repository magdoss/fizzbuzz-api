framework:
    secret: '%env(APP_SECRET)%'
    session: false
    serializer:
        default_context:
            # an invalid UTF-8 byte in a rejected parameter must not break the error response itself
            json_encode_options: !php/const JSON_INVALID_UTF8_SUBSTITUTE
    exceptions:
        Symfony\Component\HttpKernel\Exception\BadRequestHttpException: { log_level: info }
        Symfony\Component\HttpKernel\Exception\NotFoundHttpException: { log_level: info }
        Symfony\Component\HttpKernel\Exception\MethodNotAllowedHttpException: { log_level: info }

when@test:
    framework:
        test: true
